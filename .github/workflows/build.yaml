name: Build

on: [push, workflow_dispatch]

permissions:
  contents: write # To be able to apply semantic version tags to the repository

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@4d7602f0968cf3f956c8f716a3f5867bd5c0f5a1 # v0.7.20

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@4d7602f0968cf3f956c8f716a3f5867bd5c0f5a1 # v0.7.20
        with:
          version: ${{ steps.version.outputs.version }}
