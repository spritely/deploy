name: Build

on: [push, workflow_dispatch]

permissions:
  contents: write # To be able to apply semantic version tags to the repository

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@2a38af7dd8c857536cd19f86e350cbac4bfb205b # v0.7.7

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@2a38af7dd8c857536cd19f86e350cbac4bfb205b # v0.7.7
        with:
          version: ${{ steps.version.outputs.version }}
