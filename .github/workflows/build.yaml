name: Build

on: [push, workflow_dispatch]

permissions:
  contents: write # To be able to apply semantic version tags to the repository

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@1ad89f8f9ebf5f412b93f6b15445ecc8a287c662 # v0.8.13

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@1ad89f8f9ebf5f412b93f6b15445ecc8a287c662 # v0.8.13
        with:
          version: ${{ steps.version.outputs.version }}
